<div class="contacts">
  <div class="contacts__list" [class.contacts__list--hidden-mobile]="selectedContact()">
    <app-contact-list
      [selectedId]="selectedContact()?.id ?? null"
      (addClicked)="openAddForm()"
      (contactSelected)="onContactSelected($event)"
    ></app-contact-list>
  </div>

  @for (version of [contactSelectionVersion()]; track $index) {
    <div class="contacts__detail" [class.contacts__detail--visible-mobile]="selectedContact()">
      <div class="contacts__heading">
        <h1 class="contacts__title">Contacts</h1>
        <span class="contacts__divider"></span>
        <p class="contacts__subtitle">Better with a team</p>
        <button class="contacts__back" (click)="onBackToList()" aria-label="Back to list">←</button>
      </div>

      <app-contact-detail
        [contact]="selectedContact()"
        [locked]="detailLocked()"
        (editClicked)="openEditForm($event)"
        (deleteClicked)="onDeleteContact($event)"
      ></app-contact-detail>
    </div>
  }

  @if (showForm()) {
    <div class="contacts__overlay" (click)="closeForm()">
      <div class="contacts__modal" (click)="$event.stopPropagation()">
        <app-contact-form
          [editingContact]="editingContact()"
          (closed)="closeForm()"
          (saved)="onFormSaved($event)"
          (saveFailed)="onFormSaveFailed($event)"
          (deleted)="onFormDeleted()"
        ></app-contact-form>
      </div>
    </div>
  }

  @if (showToast()) {
    <div class="contacts__toast">{{ toastMessage() }}</div>
  }
</div>
