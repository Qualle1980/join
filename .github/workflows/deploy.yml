name: Deploy Join

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-join
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Join
        run: npx ng build --configuration production --base-href /join/
      - name: Install deployment client
        if: env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != ''
        run: sudo apt-get update && sudo apt-get install --yes lftp
      - name: Deploy to Netcup
        if: env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != ''
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          mirror --reverse --verbose --delete dist/join/browser/ /ahmad-ataya.de/httpdocs/join/
          bye
          EOF

